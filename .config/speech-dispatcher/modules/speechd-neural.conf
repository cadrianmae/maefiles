AddVoice "en-ie" "MALE2"        "en_US-libritts-high.onnx:640"  # Dan Froese, narration and short messages
AddVoice "en-ie" "MALE3"        "en_US-libritts-high.onnx:7"    # Kyle M., "sultry" -- the only low-pitch male shortlisted, so MALE3 is audibly distinct from MALE1 and MALE2 rather than a third normal-pitch variation
AddVoice "en-ie" "CHILD_FEMALE" "en_US-libritts-high.onnx:537"  # Becky Cook
