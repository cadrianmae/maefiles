Debug 0
GenericExecuteSynth "VOICE=\"$VOICE\" DATA=\"$DATA\" RATE=\"$RATE\" PITCH=\"$PITCH\" VOLUME=\"$VOLUME\" exec /home/cadrianmae/.local/libexec/speechd-neural/run"

# Voice types are matched against the language the CLIENT asks for, and
# speech-dispatcher requires an EXACT, lowercase match -- it will not fall
# back from "en-ie" to "en", nor fold case. A client on an en_IE locale
# asking for MALE1 against a table declared only under "en" gets:
#
#   There are no voices in the table for language=en-ie
#   Invalid voice type specified or no voice available!
#
# and is silently given DefaultVoice instead, so every voice type sounds
# identical. install.sh therefore repeats each en line below once per
AddVoice "en" "FEMALE1"      "en_GB-cori-high.onnx"          # cori -- preferred over Melora in a side-by-side; also the DefaultVoice
AddVoice "en" "FEMALE2"      "en_US-libritts-high.onnx:64"   # Melissa Burns-Price
AddVoice "en" "FEMALE3"      "en_US-libritts-high.onnx:316"  # Patricia Oakley, nice for reading
AddVoice "en" "MALE1"        "en_US-libritts-high.onnx:386"  # Mark DeVol, clear
AddVoice "en" "MALE2"        "en_US-libritts-high.onnx:640"  # Dan Froese, narration and short messages
AddVoice "en" "MALE3"        "en_US-libritts-high.onnx:7"    # Kyle M., "sultry" -- the only low-pitch male shortlisted, so MALE3 is audibly distinct from MALE1 and MALE2 rather than a third normal-pitch variation
AddVoice "en" "CHILD_FEMALE" "en_US-libritts-high.onnx:537"  # Becky Cook
AddVoice "en" "CHILD_MALE"   "en_US-libritts-high.onnx:172"  # Miriam Esther Goldman, "kinda sounds like a kid"
# identical. install.sh therefore repeats each en-gb line below once per
AddVoice "en-gb" "FEMALE1"      "en_GB-cori-high.onnx"          # cori -- preferred over Melora in a side-by-side; also the DefaultVoice
AddVoice "en-gb" "FEMALE2"      "en_US-libritts-high.onnx:64"   # Melissa Burns-Price
AddVoice "en-gb" "FEMALE3"      "en_US-libritts-high.onnx:316"  # Patricia Oakley, nice for reading
AddVoice "en-gb" "MALE1"        "en_US-libritts-high.onnx:386"  # Mark DeVol, clear
AddVoice "en-gb" "MALE2"        "en_US-libritts-high.onnx:640"  # Dan Froese, narration and short messages
AddVoice "en-gb" "MALE3"        "en_US-libritts-high.onnx:7"    # Kyle M., "sultry" -- the only low-pitch male shortlisted, so MALE3 is audibly distinct from MALE1 and MALE2 rather than a third normal-pitch variation
AddVoice "en-gb" "CHILD_FEMALE" "en_US-libritts-high.onnx:537"  # Becky Cook
AddVoice "en-gb" "CHILD_MALE"   "en_US-libritts-high.onnx:172"  # Miriam Esther Goldman, "kinda sounds like a kid"
# identical. install.sh therefore repeats each en-ie line below once per
AddVoice "en-ie" "FEMALE1"      "en_GB-cori-high.onnx"          # cori -- preferred over Melora in a side-by-side; also the DefaultVoice
AddVoice "en-ie" "FEMALE2"      "en_US-libritts-high.onnx:64"   # Melissa Burns-Price
AddVoice "en-ie" "FEMALE3"      "en_US-libritts-high.onnx:316"  # Patricia Oakley, nice for reading
