# language: "en", "en-gb", and the installing user's own locale tag.
#
# Only these eight type names exist. Anything else (FEMALE4, ROBOT1, ...) is
# rejected at load with "Unrecognized voice name in configuration":
#
#   MALE1 MALE2 MALE3 FEMALE1 FEMALE2 FEMALE3 CHILD_MALE CHILD_FEMALE
#
# "model.onnx:N" selects speaker N of a multi-speaker model.
#
# The assignments below were chosen by ear, auditioning 579 voices with
# piper-audition and picking per slot. The note after each is the listening
# note that decided it.

# American models keep their own table; a client on an en_US locale asks for
# "en-us" and would not match the block above. Note the tag is lowercase:
# the comparison is byte-for-byte against what the client sends, so "en-US"
# here would silently match nothing.
AddVoice "en-us" "FEMALE1"      "en_US-lessac-medium.onnx"
AddVoice "en-us" "FEMALE2"      "glados_piper_medium.onnx"

# Spoken whenever no voice type is requested, which is most traffic --
# including notify-tts. Deliberately not one of the slots above: changing it
# changes the everyday voice, which is a separate decision from casting the
# eight types.
DefaultVoice "en_GB-cori-high.onnx"

GenericRateAdd 0
GenericRateMultiply 1
GenericPitchAdd 0
GenericPitchMultiply 1
GenericVolumeAdd 0
GenericVolumeMultiply 1
GenericDelimiters "|"
GenericMaxChunkLength 99999
