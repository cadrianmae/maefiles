# speech-dispatcher user configuration.
#
# This file REPLACES /etc/speech-dispatcher/speechd.conf -- it is not merged
# with it. Verified 2026-08-09 by running an isolated instance against a
# config containing only "LogLevel 4": it loaded zero output modules, while
# the same instance given an AddModule line loaded them normally. So every
# setting this session needs must be present here, in this file.
#
# The stock file, with its full commentary on every option, stays available
# at /etc/speech-dispatcher/speechd.conf as the reference copy. Only the
# lines that actually do something are kept below.

# ----- DAEMON LIFETIME -----
# Absent from this file the built-in default applies, which is 5 seconds
# (stock speechd.conf, "Timeout 5"). At that setting the daemon exits after
# every notification and the next spd-say respawns it, and each spawn writes
# ~2.7 MB of log: on start it asks every module for its voice list, and
# output.c:output_get_voices logs one "LINE here:" line per voice at MSG
# level 1 -- below the lowest LogLevel, so no logging setting suppresses it.
# espeak-ng alone reports ~7000 voices, 99.6% of the volume. Measured
# 2026-08-16: 594 spawns over six days filled the 1.6 GB tmpfs backing
# XDG_RUNTIME_DIR to 100%. 0 disables the timeout, so the daemon persists
# and the dump happens once per boot instead of once per notification.
Timeout 0

# ----- LOGGING -----
# Logs land in $XDG_RUNTIME_DIR/speech-dispatcher/log/, one file per module.
LogLevel 1
LogDir "default"

# ----- VOICE DEFAULTS -----
# Rate, pitch and pitch range are deliberately absent: setting them to 0
# only restated the built-in default. Speaking rate is set in the module
# instead, at ~/.config/speechd-neural/config.toml (piper.length_scale),
# which is the value speech-dispatcher's rate knob then swings around.
DefaultVolume 100

# ----- SYMBOL PREPROCESSING -----
# Load-bearing: without these, punctuation, emoji and symbols are read
# verbatim rather than translated into words.
SymbolsPreproc "char"
SymbolsPreprocFile "gender-neutral.dic"
SymbolsPreprocFile "font-variants.dic"
SymbolsPreprocFile "symbols.dic"
SymbolsPreprocFile "emojis.dic"
SymbolsPreprocFile "orca.dic"
SymbolsPreprocFile "orca-chars.dic"

# ----- AUDIO -----
# Predates speechd-neural; the stock default is "pipewire", and pulse reaches
# the same server through the pipewire-pulse compatibility layer. Left alone
# deliberately: changing the audio path mid-soak would muddy what the soak
# is meant to be testing.
AudioOutputMethod pulse

# ----- OUTPUT MODULES -----
# speech-dispatcher appends "espeak-ng-fallback" and "dummy" to this list by
# itself; they are not configured anywhere. That built-in chain is what takes
# over when the default module fails to load.
AddModule "espeak-ng"      "sd_espeak-ng" "espeak-ng.conf"
AddModule "speechd-neural" "sd_generic"   "speechd-neural.conf"

# Superseded by speechd-neural (2026-08-09). Commented out rather than
# deleted: the piper-generic module config, its scripts under piper/, and the
# piper-daemon systemd unit are all still in place. Rollback is uncommenting
# this line and pointing DefaultModule back at piper-generic.
#AddModule "piper-generic"  "sd_generic"   "piper-generic.conf"

DefaultModule speechd-neural

# Per-client overrides. The directory is currently empty.
Include "clients/*.conf"
