Debug 1

# Piper TTS via sd_generic — raw PCM straight to paplay (PipeWire PulseAudio layer)
# IMPORTANT: shell vars must NOT start with VOICE/DATA/RATE/PITCH/VOLUME since
# sd_generic substitutes those greedily (prefix match) into the command text
# before passing it to sh. So we use MODEL/SPK/SR/SPKARG instead.
GenericExecuteSynth "VOICE=\"$VOICE\" DATA=\"$DATA\" RATE=\"$RATE\" PITCH=\"$PITCH\" VOLUME=\"$VOLUME\" exec /home/cadrianmae/.config/speech-dispatcher/piper-run.sh"

GenericCmdDependency "jq"
GenericCmdDependency "paplay"

# --- "en" catchall (matches en-IE, en-GB, en-AU via SD fallback) ---
AddVoice "en" "FEMALE1"      "en_GB-aru-medium.onnx"
AddVoice "en" "FEMALE2"      "en_GB-southern_english_female-low.onnx"
AddVoice "en" "FEMALE3"      "en_GB-semaine-medium.onnx:0"
AddVoice "en" "MALE1"        "en_GB-semaine-medium.onnx:2"
AddVoice "en" "MALE2"        "en_GB-semaine-medium.onnx:1"
AddVoice "en" "CHILD_FEMALE" "en_GB-semaine-medium.onnx:3"

# --- en-US specific (American accents) ---
AddVoice "en-US" "FEMALE1"   "en_US-lessac-medium.onnx"
AddVoice "en-US" "FEMALE2"   "glados_piper_medium.onnx"

DefaultVoice "en_GB-southern_english_female-low.onnx"

# Pass-through multipliers
GenericRateAdd 0
GenericRateMultiply 1
GenericPitchAdd 0
GenericPitchMultiply 1
GenericVolumeAdd 0
GenericVolumeMultiply 1

GenericDelimiters "|"
GenericMaxChunkLength 99999
