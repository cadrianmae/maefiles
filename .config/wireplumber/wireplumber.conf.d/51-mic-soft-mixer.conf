## Disable staged hardware-gain slider for built-in audio card.
## KDE slider becomes pure software volume; WirePlumber/ACP stops
## touching Capture / Internal Mic Boost / Headset Mic Boost.
##
## NOTE: api.alsa.soft-mixer is a DEVICE-level property (not node-level).
## Must match on device.name, not node.name.

monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.pci-0000_00_1f.3" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
