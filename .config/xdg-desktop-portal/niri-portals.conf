[preferred]
# Fallback backend for interfaces not named below.
# gnome first so screencast (Discord/OBS) works, gtk as backstop.
default=gnome;gtk

# Permission dialogs -> GTK. Upstream's own niri-portals.conf sets this and
# ours had dropped it, so Access fell through to default=gnome, whose dialog
# needs GNOME Shell. Anything asking permission then waits forever:
#   flameshot: error: Screenshot portal timed out after 30 seconds
org.freedesktop.impl.portal.Access=gtk

# File chooser dialog -> GTK (light, reliable on niri).
# To use Dolphin's KDE picker instead, change this line to:
#   org.freedesktop.impl.portal.FileChooser=kde
org.freedesktop.impl.portal.FileChooser=gtk

# Notifications -> GTK, which forwards to org.freedesktop.Notifications (noctalia).
# Must be set explicitly: the gnome backend routes to org.gtk.Notifications
# (GNOME Shell), which does not run under niri, so notifications are dropped.
org.freedesktop.impl.portal.Notification=gtk
