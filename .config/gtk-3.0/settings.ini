[Settings]
# gtk-application-prefer-dark-theme is deliberately NOT set here.
#
# Noctalia owns light/dark. Its gtk3/gtk4 templates post_hook
# templates/gtk/apply.sh, which sets gsettings org.gnome.desktop.interface
# color-scheme=prefer-{dark,light} on every theme change. Hardcoding this key
# pinned GTK3 to dark while GTK4/libadwaita (which reads only the portal)
# followed Noctalia into light -- the two toolkits disagreed on every screen.
#
# gtk-theme-name is likewise absent: gsettings wins over this file for it
# (verified -- settings.ini said adw-gtk3-dark while GTK resolved adw-gtk3),
# so apply.sh's gtk-theme setting is the single source of truth.
gtk-button-images=true
gtk-cursor-blink=true
gtk-cursor-blink-time=1000
gtk-cursor-theme-name=Posy_Cursor
gtk-cursor-theme-size=32
gtk-decoration-layout=icon:minimize,maximize,close
gtk-enable-animations=true
gtk-enable-event-sounds=true
gtk-font-name=Noto Sans,  10
gtk-icon-theme-name=Papirus-Dark
gtk-menu-images=true
gtk-modules=colorreload-gtk-module:window-decorations-gtk-module
gtk-primary-button-warps-slider=true
gtk-sound-theme-name=modern-minimal-ui-sounds-v1.1
gtk-toolbar-style=3
gtk-xft-dpi=98304
