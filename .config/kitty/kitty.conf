# Catppuccin Macchiato theme
include catppuccin-macchiato.conf

# Font — A/B trial: comment one block, uncomment another. Reload with Ctrl+Shift+F5.
#
# CaskaydiaCove (active):
font_family      CaskaydiaCove Nerd Font Mono
bold_font        CaskaydiaCove Nerd Font Mono SemiBold
italic_font      CaskaydiaCove Nerd Font Mono Italic
bold_italic_font CaskaydiaCove Nerd Font Mono SemiBold Italic
#
# IntelOne Mono — accessibility-tested, highest x-height:
# font_family      IntoneMono Nerd Font Mono
# bold_font        IntoneMono Nerd Font Mono Bold
# italic_font      IntoneMono Nerd Font Mono Italic
# bold_italic_font IntoneMono Nerd Font Mono Bold Italic
#
# Atkinson Hyperlegible Mono — Braille Institute, low-vision research-backed:
# Atkinson only ships Light/Regular/Medium — using Medium for less-thin baseline.
# font_family      AtkynsonMono Nerd Font Mono Medium
# bold_font        AtkynsonMono Nerd Font Mono Medium
# italic_font      AtkynsonMono Nerd Font Mono Medium Italic
# bold_italic_font AtkynsonMono Nerd Font Mono Medium Italic
#
# OpenDyslexic — weighted-bottom letterforms (controversial efficacy):
# font_family      OpenDyslexicM Nerd Font Mono
# bold_font        OpenDyslexicM Nerd Font Mono Bold
# italic_font      OpenDyslexicM Nerd Font Mono Italic
# bold_italic_font OpenDyslexicM Nerd Font Mono Bold Italic

font_size        13.0

# Line spacing — extra breathing room for sustained reading
modify_font cell_height 115%

# Ligatures (Cascadia Code has nice ones)
disable_ligatures never

# Window
window_padding_width 8
background_opacity 1.0

# Bell
enable_audio_bell no
visual_bell_duration 0.0

# Cursor
cursor_shape beam
cursor_blink_interval 0.5

# Scrollback
scrollback_lines 10000

# URLs
url_style curly
open_url_with default

# Tab bar
tab_bar_style powerline
tab_powerline_style slanted


# BEGIN_KITTY_THEME
# Mae Dusk
include current-theme.conf
# END_KITTY_THEME