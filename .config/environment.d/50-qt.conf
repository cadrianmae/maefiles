# Qt apps have no theming of their own under niri -- there is no desktop
# environment to tell them what to look like, so they fall back to a light
# Fusion palette that clashes badly with a dark session.
#
# qt6ct provides the platform theme plugin; noctalia generates the palette into
# ~/.config/qt6ct/colors/noctalia.conf from the Lumae colours.
#
# The plugin name is per Qt major version -- Qt5 looks for "qt5ct", Qt6 for
# "qt6ct" -- so one variable cannot serve both. Every Qt app installed here
# (qdirstat, qjackctl, strawberry) is Qt6, so qt6ct it is. qt5ct is installed
# and configured too, ready if a Qt5 app ever turns up.
QT_QPA_PLATFORMTHEME=qt6ct
