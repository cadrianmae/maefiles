# Prefix key: Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Mouse mode
set -g mouse on

# Pane titles
set -g pane-border-status top
set -g pane-border-format " #{pane_index} #{pane_title} "

# Vi mode
set -g mode-keys vi

# Vi copy mode bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Move windows left/right
bind-key < swap-window -t -1\; select-window -t -1
bind-key > swap-window -t +1\; select-window -t +1

# Split panes using current directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Status bar at top
set -g status-position top

# Allow passthrough for image.nvim (kitty graphics protocol)
set -g allow-passthrough on
set -g visual-activity off
set -ga terminal-features ",xterm-kitty:RGB"
set -ga terminal-overrides ",xterm-kitty:Tc"
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -ga update-environment TZ

# List of plugins
# General
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'alexwforsythe/tmux-which-key'

# Navigation & Layout
set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin '2kabhishek/tmux-tilit'
# set -g @tilit-navigator 'on'  # integrate with vim-tmux-navigator

# Theme
set -g @plugin 'catppuccin/tmux#v2.1.3' # See https://github.com/catppuccin/tmux/tags for additional tags

# Status Bar
set -g @plugin '2kabhishek/tmux2k'
set -g @tmux2k-theme 'catppuccin'

# Essential
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# Productivity
set -g @plugin 'laktak/extrakto'
# set -g @plugin 'olimorris/tmux-pomodoro-plus'
# set -g @pomodoro_toggle 'P'
# set -g @pomodoro_cancel 'C-p'
# set -g @pomodoro_mins 25
# set -g @pomodoro_break_mins 5
# set -g @pomodoro_long_break_mins 15
# set -g @pomodoro_intervals 4
# set -g @pomodoro_repeat 'on'
# set -g @pomodoro_notifications 'on'
# set -g @pomodoro_sound 'on'
# set -g @pomodoro_granularity 'off'
# set -g @pomodoro_on " 🍅"
# set -g @pomodoro_complete " ✔︎"
# set -g @pomodoro_pause " ⏸︎"

# tmux2k status bar plugins
set -g @tmux2k-cwd-length 25
set -g @tmux2k-right-plugins "pomodoro claude ram time"
set -g @tmux2k-claude-icon "󰚩"
set -g @tmux2k-claude-colors "orange text"
set -g @tmux2k-time-format "%d %b %H:%M"

# Auto-restore (enabled - saves every 15 minutes and restores on tmux start)
set -g @continuum-restore 'on'


# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
