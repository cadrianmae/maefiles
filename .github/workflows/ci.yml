name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          # Exclude her pre-existing bin/ scripts adopted from Stow — they
          # have known warnings not in scope for this migration. New scripts
          # under bin/yadm-* + bin/render-env + bin/nvim-sync still get
          # checked (explicitly re-added via additional_files).
          ignore_paths: 'bin'
          additional_files: >-
            bin/render-env
            bin/nvim-sync
            bin/yadm-audit
            bin/yadm-check-staleness
            bin/yadm-discover
            bin/yadm-refresh-secrets
            bin/yadm-verify-encryption

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  install-smoke-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [fedora:43, fedora:42, ubuntu:24.04, archlinux:latest]
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install curl + bash
        run: |
          if command -v dnf; then dnf install -y curl git
          elif command -v apt-get; then apt-get update && apt-get install -y curl git
          elif command -v pacman; then pacman -Sy --noconfirm curl git
          fi
      - uses: actions/checkout@v4
      - name: Syntax check install.sh
        run: bash -n install.sh
      - name: Dry-run install.sh
        run: bash install.sh --dry-run --no-confirm
