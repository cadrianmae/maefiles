name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck yadm-authored scripts
        run: |
          # Install shellcheck
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

          # Explicit list of files we author + maintain (not adopted from
          # stow nor zsh-specific). shellcheck doesn't support zsh, and
          # the adopted stow scripts have pre-existing warnings we're
          # not touching as part of this migration.
          files=(
            install.sh
            lib/runlib.sh
            .config/yadm/bootstrap
            .config/yadm/hooks/post_alt
            .config/yadm/hooks/post_pull
            .config/yadm/hooks/pre_commit
            bin/render-env
            bin/nvim-sync
            bin/yadm-audit
            bin/yadm-check-staleness
            bin/yadm-discover
            bin/yadm-refresh-secrets
            bin/yadm-verify-encryption
          )

          fail=0
          for f in "${files[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "::warning file=$f::missing, skipping"
              continue
            fi
            if ! shellcheck --severity=warning --format=gcc "$f"; then
              fail=1
            fi
          done
          exit $fail

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  install-smoke-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [fedora:43, fedora:42, ubuntu:24.04, archlinux:latest]
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install curl + bash
        run: |
          if command -v dnf; then dnf install -y curl git
          elif command -v apt-get; then apt-get update && apt-get install -y curl git
          elif command -v pacman; then pacman -Sy --noconfirm curl git
          fi
      - uses: actions/checkout@v4
      - name: Syntax check install.sh
        run: bash -n install.sh
      - name: Dry-run install.sh
        run: bash install.sh --dry-run --no-confirm
