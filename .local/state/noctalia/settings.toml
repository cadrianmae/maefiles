config_version = 14

[audio]
enable_sounds = true

[bar.default]
center = [ "recorder", "cat", "clock", "audio_visualizer" ]
end = [
    "media",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "keyboard_layout",
    "control-center",
    "session"
]
margin_ends = 8
scale = 1.1000000089406967
start = [ "launcher", "active_window", "wallpaper", "theme_mode", "workspaces", "widget", "mae/sysmon:sysmon" ]

[calendar]

[control_center.calendar]
show_week_numbers = true

[dock]
enabled = true
icon_size = 36
launcher_position = "start"
pinned = [ "org.wezfurlong.wezterm", "zen", "obsidian", "com.blitzfc.qbz" ]
reserve_space = false
show_dots = true
smart_auto_hide = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 30

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 7200.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 881.5
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 881.5
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true

[osd]
offset_y = 128
orientation = "vertical"
position = "bottom_center"
position_vertical = "center_right"

[plugin_settings."davemhammer/obsidian"]
vault_path = "~/Documents/MaeNotes"

[plugin_settings."noctalia/screen_recorder"]
copy_to_clipboard = true
replay_enabled = true
video_source = "focused"

[plugins]
enabled = [ "mae/sysmon", "noctalia/bongocat", "noctalia/kaomoji", "icefish/phone-connect" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "path"
    location = "/home/cadrianmae/.local/state/noctalia/plugins/sources/local"
    name = "local"

    [[plugins.source]]
    kind = "path"
    location = "/home/cadrianmae/git/github.com/cadrianmae/focustimer-bridge/frontends/noctalia"
    name = "focustimer"

[shell]
avatar_path = "/var/lib/AccountsService/icons/cadrianmae"
clipboard_image_action_command = "satty -f - --fullscreen --initial-tool crop"
launch_apps_as_systemd_services = true
panel_anchor_bar = "default"
polkit_agent = true

    [shell.panel]
    transparency_mode = "glass"

    [shell.screen_corners]
    enabled = true

    [shell.screenshot]
    confirm_region = true
    directory = "~/Pictures/Screenshots/"
    pipe_command = "satty --initial-tool crop --fullscreen -f -"
    pipe_to_command = true

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "command"
    command = "systemctl hibernate"
    countdown_seconds = 0.0
    enabled = true
    glyph = "hibernate"
    label = "Hibernate"
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "6"
    variant = "destructive"

    [shell.window_switcher]
    mru = true

[theme]
builtin = "Ayu"
community_palette = "Catppuccin Mocha Pink"
custom_palette = "Lumae-Dusk"
mode = "dark"
source = "community"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "niri", "qt", "wezterm" ]
    community_ids = [ "bat" ]

[wallpaper]
directory = "/home/cadrianmae/Pictures/Wallpaper 2024"
transition_on_startup = true

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/home/cadrianmae/Pictures/Wallpaper 2024/jacky-zeng-4MBsxirQvqc-unsplash.jpg"

    [wallpaper.last]
    path = "/home/cadrianmae/Pictures/Wallpaper 2024/jacky-zeng-4MBsxirQvqc-unsplash.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/cadrianmae/Pictures/Wallpaper 2024/jacky-zeng-4MBsxirQvqc-unsplash.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/cadrianmae/Pictures/Wallpaper 2024/jacky-zeng-4MBsxirQvqc-unsplash.jpg"

[widget.active_window]
max_length = 128
min_length = 128
show_empty_label = true
title_scroll = "on_hover"

[widget.audio_visualizer]
bands = 24
color_2 = "secondary"
interactive = false
mirrored = false
width = 96

[widget.brightness]
show_label = false

[widget.cat]
audio_spectrum = true
input_devices = [
    "/dev/input/by-path/platform-i8042-serio-0-event-kbd",
    "/dev/input/by-id/usb-Logitech_USB_Receiver-if02-event-kbd",
    "/dev/input/by-id/usb-Keychron_Keychron_Link-if02-event-kbd"
]
scale = 2.0
tappy_mode = true
type = "noctalia/bongocat:cat"
use_mpris_filter = true

[widget.clock]
anchor = true
format = "{:%T %W %a %-d %b} "
tooltip_format = "{:%c}"

[widget.media]
capsule = true
hide_when_no_media = true
max_length = 192
min_length = 192
title_scroll = "always"

[widget.network]
show_label = false
vpn_status = "both"

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.tray]
capsule = true

[widget.volume]
show_label = false

[widget.widget]
type = "mae/focus-timer:focus-timer"