config_version = 8

[bar.default]
center = [ "audio_visualizer", "clock", "audio_visualizer" ]
end = [
    "media",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "keyboard_layout",
    "control-center",
    "session"
]
scale = 1.1000000089406967
start = [ "launcher", "active_window", "wallpaper", "workspaces", "mae/sysmon:sysmon" ]

[dock]
enabled = true
icon_size = 24
launcher_position = "start"
reserve_space = false
show_dots = true
smart_auto_hide = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 229.0
    box_width = 810.0
    cx = 960.0
    cy = 881.5
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 229.0
    box_width = 810.0
    cx = 960.0
    cy = 881.5
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_weather = true

[plugins]
enabled = [ "mae/sysmon" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "path"
    location = "/home/cadrianmae/.local/state/noctalia/plugins/sources/local"
    name = "local"

[shell]
panel_anchor_bar = "default"

    [shell.panel]
    transparency_mode = "glass"

[theme]
builtin = "Catppuccin"
community_palette = "Oxocarbon"
custom_palette = "Lumae-Midnight"
source = "custom"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "niri", "qt", "wezterm" ]

[wallpaper]
directory = "/home/cadrianmae/Pictures/Wallpaper 2024"

    [wallpaper.default]
    path = "/home/cadrianmae/Pictures/Wallpaper 2024/jacky-zeng-4MBsxirQvqc-unsplash.jpg"

    [wallpaper.last]
    path = "/home/cadrianmae/Pictures/Wallpaper 2024/jacky-zeng-4MBsxirQvqc-unsplash.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/cadrianmae/Pictures/Wallpaper 2024/jacky-zeng-4MBsxirQvqc-unsplash.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/cadrianmae/Pictures/Wallpaper 2024/jacky-zeng-4MBsxirQvqc-unsplash.jpg"

[widget.audio_visualizer]
color_2 = "secondary"
mirrored = false

[widget.brightness]
show_label = false

[widget.clock]
format = "{:%H:%M:%S}"

[widget.media]
capsule = true
max_length = 128
title_scroll = "always"

[widget.network]
show_label = false
vpn_status = "both"

[widget.tray]
capsule = true

[widget.volume]
show_label = false